[package]
name = "scratchpad-zellij"
version = "0.1.0"
edition = "2021"
description = "Zellij plugin showing which panes have a scratchpad relay listening for them"
license = "MIT"

[dependencies]
zellij-tile = "0.44.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
# Plugins are loaded from disk on every zellij start, so size is worth more than
# the last few percent of speed. This plugin spends its life asleep between timers.
opt-level = "z"
lto = true
strip = true
